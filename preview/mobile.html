<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8">
<style>
  :root{--navy:#0B1B2B;--primary:#3B5A80;--accent:#14B8A6;--ink:#0F172A;--muted:#6B7280;--hair:rgba(15,23,42,.09);--tint:#F4F6F8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans Arabic','Vazirmatn',system-ui,sans-serif;background:#F8FAFB;color:var(--ink);-webkit-font-smoothing:antialiased;width:390px}
  header{background:#fff;border-bottom:1px solid var(--hair)}
  .row{height:60px;display:flex;align-items:center;gap:10px;padding:0 16px}
  .ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--hair);background:#fff;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
  .ib svg{width:21px;height:21px;stroke:var(--navy);fill:none;stroke-width:1.8;stroke-linecap:round}
  .badge{position:absolute;top:-6px;left:-6px;min-width:19px;height:19px;border-radius:999px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none}
  .sp{flex:1}
  .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--navy),var(--primary));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(11,27,43,.2)}
  .mark svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.9}
  .bn{font-size:14.5px;font-weight:700;color:var(--navy);line-height:1.2}
  .bs{font-size:10.5px;color:var(--muted);line-height:1.35}
  .searchrow{padding:0 16px 12px}
  .search{position:relative}
  .search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--hair);background:var(--tint);padding:0 40px 0 14px;font:inherit;font-size:14px;outline:none}
  .search input::placeholder{color:#9AA3AF}
  .si{position:absolute;top:50%;transform:translateY(-50%);right:13px;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.9}
  .chips{display:flex;gap:8px;overflow:hidden;padding:0 16px 12px}
  .chip{white-space:nowrap;font-size:12.5px;font-weight:600;color:#334155;background:var(--tint);border:1px solid var(--hair);border-radius:999px;padding:8px 14px}
  .chip.on{background:rgba(20,184,166,.1);border-color:rgba(20,184,166,.25);color:#0F766E}
  .hero{height:120px;background:radial-gradient(at 75% 40%,rgba(20,184,166,.12) 0%,transparent 60%),#F8FAFB}
  /* bottom tab bar */
  .tabs{position:relative;margin-top:150px;background:#fff;border-top:1px solid var(--hair);display:flex;height:64px;padding-bottom:6px}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;color:var(--muted);text-decoration:none;position:relative}
  .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  .tab.on{color:var(--accent);font-weight:700}
  .tab .dot{position:absolute;top:-1px;width:26px;height:2.5px;border-radius:2px;background:var(--accent)}
  .tab .bg2{position:absolute;top:4px;left:50%;transform:translateX(-50%);min-width:17px;height:17px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-inline-start:16px;border:2px solid #fff}
  .lbl{padding:14px 16px 8px;font-size:11px;font-weight:700;letter-spacing:.12em;color:#94A3B8}
</style></head>
<body>
<div class="lbl">موبایل — ۳۹۰px</div>
<header>
  <div class="row">
    <a class="brand" href="#">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 10-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg></span>
      <span><span class="bn">آتی فرزام</span><br><span class="bs">ردیاب GPS خودرو</span></span>
    </a>
    <span class="sp"></span>
    <button class="ib"><svg viewBox="0 0 24 24"><path d="M4 5h2l2.2 10.2a2 2 0 002 1.6h7.2a2 2 0 002-1.55L21 8H7"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg><span class="badge">۲</span></button>
    <button class="ib"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  </div>
  <div class="searchrow"><div class="search">
    <svg class="si" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
    <input placeholder="جستجوی ردیاب، مدل یا برند…">
  </div></div>
  <div class="chips">
    <span class="chip on">همه</span><span class="chip">ردیاب خودرو</span><span class="chip">ناوگان</span><span class="chip">موتور</span>
  </div>
</header>
<div class="hero"></div>
<div class="tabs">
  <a class="tab on" href="#"><span class="dot"></span><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></svg>خانه</a>
  <a class="tab" href="#"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.6"/><rect x="13" y="4" width="7" height="7" rx="1.6"/><rect x="4" y="13" width="7" height="7" rx="1.6"/><rect x="13" y="13" width="7" height="7" rx="1.6"/></svg>دسته‌بندی</a>
  <a class="tab" href="#"><svg viewBox="0 0 24 24"><path d="M4 5h2l2.2 10.2a2 2 0 002 1.6h7.2a2 2 0 002-1.55L21 8H7"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>سبد خرید</a>
  <a class="tab" href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg>پروفایل</a>
</div>
</body></html>
